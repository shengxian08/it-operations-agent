[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "it-operations-agent-api"
version = "0.1.0"
description = "API and agent runtime for the IT Operations Agent portfolio project."
requires-python = ">=3.11,<3.15"
dependencies = [
    "alembic>=1.13,<2",
    "asyncpg>=0.29,<1",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "langgraph>=0.2,<2",
    "markdown-it-py==4.2.0",
    "openai>=1.55,<3",
    "opentelemetry-api>=1.28,<2",
    "opentelemetry-sdk>=1.28,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.28,<2",
    "prometheus-client>=0.21,<1",
    "PyJWT[crypto]>=2.10,<3",
    "python-multipart>=0.0.20,<1",
    "pymupdf>=1.24,<2",
    "pydantic-settings>=2.5,<3",
    "qdrant-client>=1.12,<1.17",
    "rank-bm25>=0.2.2,<1",
    "redis>=5,<7",
    "sqlalchemy[asyncio]>=2.0,<3",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=0.24,<2",
    "ruff>=0.12,<1",
]
rag = [
    "sentence-transformers>=3.1,<6",
    "torch>=2.7,<3",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
addopts = "--strict-markers"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.uv]
# Local wheels must be rebuilt when application code changes, including in Docker's
# persistent uv cache. The default only tracks packaging metadata.
cache-keys = [{ file = "pyproject.toml" }, { file = "app/**/*.py" }]
