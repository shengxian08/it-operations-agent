events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    server_tokens off;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=120r/m;
    server {
        listen 8443 ssl;
        ssl_certificate /run/secrets/tls_cert;
        ssl_certificate_key /run/secrets/tls_key;
        ssl_protocols TLSv1.2 TLSv1.3;
        client_max_body_size 21m;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data:; font-src 'self'; style-src 'self'; script-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        location = /metrics { return 404; }
        location = /health/ready { return 404; }
        location = /api/v1/auth/login {
            limit_req zone=auth burst=30 nodelay;
            limit_req_status 429;
            proxy_pass http://api:8000;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
        location /api/ {
            proxy_pass http://api:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 150s;
        }
        location = /identity/admin { return 404; }
        location /identity/admin/ { return 404; }
        location = /identity/realms/master { return 404; }
        location /identity/realms/master/ { return 404; }
        location /identity/ {
            proxy_pass http://keycloak:8080;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # Override inherited gateway headers; preserve Keycloak's own nonce-bearing CSP.
            add_header Strict-Transport-Security "max-age=31536000" always;
            add_header X-Content-Type-Options nosniff always;
        }
        location / { proxy_pass http://web:8080; proxy_set_header Host $http_host; }
    }
}
